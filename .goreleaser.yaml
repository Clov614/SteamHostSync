# .goreleaser.yaml — GoReleaser v2 schema
# 文档: https://goreleaser.com
version: 2

before:
  hooks:
    - go generate ./...

builds:
  - id: steamhostsync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - '386'
      - amd64
      - arm
      - arm64
    goarm:
      - '7'
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: '386'
  - id: steamhostsync-mips
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - mips
      - mipsle
    gomips:
      - softfloat

archives:
  - id: steamhostsync
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}{{ if .Mips }}_{{ .Mips }}{{ end }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip