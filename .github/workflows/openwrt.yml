name: OpenWrt

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install shell tools
        run: sudo apt-get update && sudo apt-get install -y busybox shellcheck
      - name: Check POSIX shell scripts
        run: |
          shellcheck -s sh contrib/openwrt/files/usr/libexec/steamhostsync-update
          shellcheck -s sh contrib/openwrt/files/usr/sbin/steamhostsyncctl
          shellcheck -s sh contrib/openwrt/files/etc/init.d/steamhostsync
          shellcheck -s sh contrib/openwrt/tests/run.sh contrib/openwrt/tests/test_*.sh
      - name: Run OpenWrt tests with BusyBox ash
        run: busybox ash contrib/openwrt/tests/run.sh
      - name: Vet
        run: go vet ./...
      - name: Test with race detector and coverage
        run: go test -race -coverprofile=coverage.out ./internal/...
      - name: Enforce coverage
        run: |
          go tool cover -func=coverage.out | grep '^total:' | \
            awk '{gsub(/%/,"",$3); if ($3 + 0 < 80) {print "COVERAGE " $3 "% < 80%"; exit 1} else {print "COVERAGE OK " $3 "%"}}'
      - name: Cross-compile OpenWrt MIPS binaries
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat \
            go build -trimpath -ldflags='-s -w' -o /tmp/steamhostsync-linux-mips .
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
            go build -trimpath -ldflags='-s -w' -o /tmp/steamhostsync-linux-mipsle .
          test -s /tmp/steamhostsync-linux-mips
          test -s /tmp/steamhostsync-linux-mipsle
