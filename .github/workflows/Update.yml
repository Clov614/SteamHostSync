name: Update
on:
  workflow_dispatch:
  push:
    tags-ignore:
      - "v*"
    branches-ignore:
      - "dev"
  schedule:
    - cron: '0 */12 * * *'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./internal/...

      - name: Coverage gate
        run: |
          go tool cover -func=coverage.out | grep '^total:' | \
            awk '{gsub(/%/,"",$3); if ($3 + 0 < 80) {print "COVERAGE " $3 "% < 80%"; exit 1} else {print "COVERAGE OK " $3 "%"}}'

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o update .

      - name: Run
        run: |
          chmod +x update
          ./update

      - name: Commit files
        run: |
          git config --local user.email zhenghongyi1225@foxmail.com
          git config --global user.name action_bot
          git add Hosts Hosts_* README.md config.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[skip ci] auto update hosts"
            git push
          fi
        continue-on-error: true